; One configuration shared by handheld and docked mode. No time-based switching.
active = true

[settings]
; Color temperature in kelvin, 1000 to 10000
temperature = 6500
saturation = 1.0
hue = 0.0
components = all
filter = none
contrast = 1.0
gamma = 2.4
; Relative shadow gamma: 0.5-1.5; 1.0 neutral, higher lifts shadows
shadow_gamma = 1.0
luminance = 0.0
; SDR contrast enhancement: 0.0 (off) to 1.0 (full)
fake_hdr = 0.0
range = 0.0-1.0
; Idle dimming timeout in mm:ss. 00:00 disables Fizeau's extra dimming.
dimming_timeout = 05:00
